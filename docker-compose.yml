services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REPORT_PROVIDER: deterministic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
  dashboard:
    build: .
    command: python -m streamlit run src/app/dashboard.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    ports: ["127.0.0.1:8501:8501"]
    environment:
      REPORT_PROVIDER: deterministic
