[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "multimodal-risk-copilot"
version = "0.2.0"
description = "Reproducible daily market-risk review with numeric evidence and explicit model boundaries"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Peyman Gholamhosseini"}]
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
[tool.setuptools.packages.find]
include = ["src*"]
